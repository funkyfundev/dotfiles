# Starship prompt: dark (Catppuccin Mocha palette), Nerd Font icons.
# Icons are TOML unicode escapes, so this file stays readable in any editor.
# ASCII fallback: starship-ascii.toml (switch with: prompt-style ascii)
"$schema" = 'https://starship.rs/config-schema.json'

palette = "mocha"
add_newline = false
format = "$hostname$directory$git_branch$git_status$nodejs$python$golang$java$terraform$docker_context$azure$kubernetes$cmd_duration$status$jobs$line_break$character"

[palettes.mocha]
text = "#cdd6f4"
blue = "#89b4fa"
mauve = "#cba6f7"
green = "#a6e3a1"
yellow = "#f9e2af"
peach = "#fab387"
red = "#f38ba8"
teal = "#94e2d5"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[hostname]
ssh_only = true
format = "[ $hostname]($style) "
style = "bold peach"

[directory]
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
format = "[ $path]($style)[$read_only]($read_only_style) "
style = "bold blue"
read_only_style = "red"

[git_branch]
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold mauve"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold yellow"

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"
style = "green"

[python]
symbol = " "
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "yellow"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"
style = "teal"

[java]
symbol = " "
format = "[$symbol($version )]($style)"
style = "peach"

[terraform]
symbol = "\U000f1062 "
format = "[$symbol$workspace]($style) "
style = "mauve"

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "blue"

[azure]
disabled = false
symbol = "\U000f0805 "
format = "[$symbol($subscription )]($style)"
style = "blue"

[kubernetes]
disabled = false
symbol = "\U000f10fe "
format = '[$symbol$context( \($namespace\))]($style) '
style = "teal"

[cmd_duration]
min_time = 3000
format = "[ $duration]($style) "
style = "peach"

[status]
disabled = false
symbol = " "
format = "[$symbol$status]($style) "
style = "red"

[jobs]
symbol = " "
number_threshold = 1
format = "[$symbol$number]($style) "
style = "mauve"
